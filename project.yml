name: WorkoutFeed
options:
  bundleIdPrefix: dev.bibixx
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
schemes:
  WorkoutFeed:
    build:
      targets:
        WorkoutFeed: all
    run:
      config: Debug
targets:
  WorkoutFeed:
    type: application
    platform: iOS
    sources:
      - Sources
      # Icon Composer app icon; compiled by actool (Xcode 26+).
      - path: WorkoutFeed.icon
        type: file
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Workout Feed
        # Single source of truth for versions is MARKETING_VERSION/CURRENT_PROJECT_VERSION below;
        # without these, XcodeGen hardcodes 1.0/1 into the generated Info.plist.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Background App Refresh top-up (see SyncEngine.refreshTaskID).
        BGTaskSchedulerPermittedIdentifiers:
          - dev.bibixx.workout-feed.refresh
        UIBackgroundModes:
          - fetch
        # Allow plain-http feeds anywhere (LAN dev servers, homelabs, static hosts without TLS).
        # Trade-off: over http the Authorization header travels in cleartext.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # WorkoutScheduler mostly uses its own runtime prompt; these are here in case iOS asks.
        NSHealthShareUsageDescription: Used to schedule planned workouts onto your Apple Watch.
        NSHealthUpdateUsageDescription: Used to schedule planned workouts onto your Apple Watch.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bibixx.workout-feed
        ASSETCATALOG_COMPILER_APPICON_NAME: WorkoutFeed
        # Signing lives here so `xcodegen generate` never wipes it. Other developers: change to your own team.
        DEVELOPMENT_TEAM: 49FAWJ5CQ9
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.3"
        CURRENT_PROJECT_VERSION: "5"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
